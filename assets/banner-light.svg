<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="t d">
<title id="t">LE-VAI</title>
<desc id="d">Assistive access, design verification, and wave computing, built in the open. Accessibility, product, and research.</desc>
<defs>
  <style>
    @font-face { font-family: "VAI Display"; src: url(data:font/woff;base64,) format("woff"); font-weight: 700; }
    @font-face { font-family: "VAI Body"; src: url(data:font/woff;base64,) format("woff"); font-weight: 400; }
    @font-face { font-family: "VAI Mono"; src: url(data:font/woff;base64,) format("woff"); font-weight: 600; }
    .name { font-family: "VAI Display", "Arial Black", sans-serif; font-weight: 700; font-size: 96px; letter-spacing: -2px; fill: #151513; }
    .tag  { font-family: "VAI Body", "Segoe UI", sans-serif; font-size: 30px; fill: #3A3934; }
    .grp  { font-family: "VAI Mono", ui-monospace, monospace; font-weight: 600; font-size: 19px; letter-spacing: 2.5px; }

    .drop { transform-box: fill-box; transform-origin: center; animation: bloom .7s cubic-bezier(.2,.9,.25,1.15) backwards; }
    .bar  { stroke-dasharray: 64; animation: draw .55s cubic-bezier(.6,0,.2,1) backwards; }
    .bar-b { animation-delay: .05s; }
    .bar-f { animation-delay: .3s; }
    .rise { animation: rise .8s cubic-bezier(.2,.8,.2,1) backwards; }
    .r1 { animation-delay: .9s; } .r2 { animation-delay: 1.1s; } .r3 { animation-delay: 1.25s; } .r4 { animation-delay: 1.45s; }

    @keyframes bloom { from { opacity: 0; transform: scale(.2); } }
    @keyframes draw  { from { stroke-dashoffset: 64; } }
    @keyframes rise  { from { opacity: 0; transform: translateY(14px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <radialGradient id="glow" cx="0.14" cy="0.5" r="0.5">
    <stop offset="0" stop-color="rgba(255,200,40,0.16)"/><stop offset="1" stop-color="rgba(255,200,40,0.16)" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="1280" height="360" rx="20" fill="#F8F7F2"/>
<rect width="1280" height="360" rx="20" fill="url(#glow)"/>
<rect x="0.5" y="0.5" width="1279" height="359" rx="19.5" fill="none" stroke="#DEDBD0"/>
<g transform="translate(92 88)">
  <rect width="184" height="184" rx="36" fill="#000000" stroke="#000000"/>
  <g transform="translate(92 92) scale(1.9)"><path class="drop" style="animation-delay:0.55s" fill="#FECC35" d="M0 -16 C-3 -21 -7 -24.5 -7 -30 A7 7 0 0 1 7 -30 C7 -24.5 3 -21 0 -16 Z"/><path class="drop" style="animation-delay:0.63s" fill="#FECC35" d="M16 0 C21 -3 24.5 -7 30 -7 A7 7 0 0 1 30 7 C24.5 7 21 3 16 0 Z"/><path class="drop" style="animation-delay:0.71s" fill="#FECC35" d="M0 16 C-3 21 -7 24.5 -7 30 A7 7 0 0 0 7 30 C7 24.5 3 21 0 16 Z"/><path class="drop" style="animation-delay:0.79s" fill="#FECC35" d="M-16 0 C-21 -3 -24.5 -7 -30 -7 A7 7 0 0 0 -30 7 C-24.5 7 -21 3 -16 0 Z"/><line class="bar bar-b" x1="22" y1="-22" x2="-22" y2="22" stroke="#FECC35" stroke-width="15" stroke-linecap="round"/><line class="bar bar-f" x1="-22" y1="-22" x2="22" y2="22" stroke="#000000" stroke-width="23" stroke-linecap="round"/><line class="bar bar-f" x1="-22" y1="-22" x2="22" y2="22" stroke="#FECC35" stroke-width="15" stroke-linecap="round"/></g>
</g>
<text class="name rise r1" x="336" y="176">LE-VAI</text>
<text class="tag rise r2" x="340" y="226">Assistive access, design verification,</text>
<text class="tag rise r3" x="340" y="264">and wave computing, built in the open.</text>
<text class="grp rise r4" x="341" y="306"><tspan fill="#8A6400">ACCESSIBILITY</tspan><tspan fill="#66635A"> · </tspan><tspan fill="#2A4FD6">PRODUCT</tspan><tspan fill="#66635A"> · </tspan><tspan fill="#B4501F">RESEARCH</tspan></text>
</svg>
